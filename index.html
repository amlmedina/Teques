<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH3 - Guía Digital Tequesquitengo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .accordion-content { transition: all 0.3s ease-in-out; max-height: 0; overflow: hidden; opacity: 0; }
        .accordion-content.open { max-height: 2000px; opacity: 1; padding-bottom: 1.5rem; }
        .rotate-180 { transform: rotate(180deg); }
        .carousel-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 1rem; padding: 0.5rem 0.25rem 1.5rem 0.25rem; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-item { flex: 0 0 85%; scroll-snap-align: center; }
        .waves { position: relative; width: 100%; height: 60px; display: block; margin-top: -10px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
        .admin-panel { display: none; position: fixed; inset: 0; background: white; z-index: 100; overflow-y: auto; }
        .admin-panel.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        footer { margin-bottom: 0 !important; }
        .pulse-aqua { animation: pulse-aqua-animation 2s infinite; }
        @keyframes pulse-aqua-animation {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        @keyframes weatherFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .weather-in { animation: weatherFadeIn 0.5s ease forwards; }
        .stat-card { background: linear-gradient(135deg, #f8fafc, #f1f5f9); }
    </style>
</head>
<body class="bg-[#F0FDFD] text-slate-800 antialiased">

    <div id="app-content" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl overflow-hidden relative border-x border-cyan-50 flex flex-col">
        <div class="p-20 text-center text-cyan-600 flex flex-col items-center justify-center min-h-screen">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl mb-4 text-cyan-500"></i>
            <p class="font-bold uppercase tracking-widest text-xs text-cyan-700">Sincronizando PH3...</p>
        </div>
    </div>

    <!-- MODAL CONTRASEÑA -->
    <div id="password-modal" class="fixed inset-0 z-[120] hidden text-slate-700">
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closePasswordModal()"></div>
        <div class="flex min-h-full items-center justify-center p-6">
            <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-xs shadow-2xl relative text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h3 class="text-lg font-black text-slate-800 mb-2 uppercase italic tracking-tighter">Acceso Restringido</h3>
                <p class="text-xs text-slate-500 mb-6">Ingresa la clave para editar la guía</p>
                <input type="password" id="admin-pass-input" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl py-4 px-6 text-center text-xl font-black tracking-[0.5em] outline-none focus:border-cyan-500 transition-all mb-4 text-slate-800" placeholder="••••">
                <button onclick="checkAdminPassword()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Entrar</button>
                <p id="pass-error" class="text-red-500 text-[10px] font-bold mt-3 hidden uppercase italic">Contraseña incorrecta</p>
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-panel" class="admin-panel">
        <div class="sticky top-0 bg-white z-10 px-6 py-4 flex justify-between items-center border-b border-slate-100 shadow-sm">
            <h2 class="text-xl font-black text-slate-800 italic uppercase tracking-tighter">Panel de Control</h2>
            <button onclick="closeAdminPanel()" class="bg-slate-100 p-3 rounded-full text-slate-500 active:scale-90 transition-transform"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- TABS -->
        <div class="flex gap-2 px-6 py-3 border-b border-slate-100 bg-slate-50">
            <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-slate-800 text-white transition-all">📊 Analytics</button>
            <button onclick="switchTab('editor')" id="tab-editor" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-white text-slate-400 border border-slate-200 transition-all">✏️ Editar</button>
        </div>

        <!-- TAB ANALYTICS -->
        <div id="panel-analytics" class="p-5 pb-32 space-y-4">
            <div id="analytics-loading" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-3 block"></i>
                <p class="text-xs font-bold uppercase tracking-widest">Cargando datos...</p>
            </div>
            <div id="analytics-content" class="hidden space-y-4"></div>
        </div>

        <!-- TAB EDITOR -->
        <div id="panel-editor" class="hidden p-5 pb-32">
            <div id="admin-editor" class="space-y-6 text-slate-700"></div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex gap-2 max-w-md mx-auto z-[110]">
            <button onclick="saveChanges()" id="saveBtn" class="flex-grow bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">
                GUARDAR CAMBIOS EN LA NUBE
            </button>
        </div>
    </div>

    <!-- BOTÓN ADMIN -->
    <button onclick="requestAdminAccess()" class="fixed bottom-4 left-4 z-40 opacity-10 hover:opacity-100 bg-slate-800 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all">
        <i class="fa-solid fa-gear"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp, increment, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1u6Bz1PsjPUuczQ6ZjvYaQVCxUbWdj9Q",
            authDomain: "airbnb-e780c.firebaseapp.com",
            projectId: "airbnb-e780c",
            storageBucket: "airbnb-e780c.firebasestorage.app",
            messagingSenderId: "459942265651",
            appId: "1:459942265651:web:9ecd9c2e1c92804053f446"
        };

        const currentAppId = 'ph3-teques-live';
        const ADMIN_PASSWORD = "34650";
        let db, auth, siteData;

        // ─── DATOS POR DEFECTO ────────────────────────────────────────────────
        siteData = {
            clubs: [
                { id: 1, name: 'Paradise', desc: 'Excelente vista, alberca, bar y acceso directo al lago.', link: 'https://share.google/YlpZUbnx8PZsF0HMq', icon: 'fa-umbrella-beach' },
                { id: 2, name: 'Vikingos', desc: 'Ambiente clásico, muy buena comida y excelente servicio.', link: 'https://share.google/PEeBakGml2VYtPnoC', icon: 'fa-ship' }
            ],
            restaurants: [
                { id: 1, name: 'Jardines de México', desc: 'Gastronomía de alto nivel en un entorno natural.', phone: '5541304269', link: 'https://maps.app.goo.gl/FK7zsa6SMWEcigDb7' },
                { id: 2, name: 'Cangrejito Playero', desc: 'Los mariscos más frescos y ambiente climatizado.', phone: '7346904525', link: 'https://maps.app.goo.gl/B9Xqj2NSA98DB2K4A' }
            ],
            adventure: [
                { id: 1, name: 'Paracaidismo', desc: 'Vive la adrenalina máxima con un salto tándem a 17,000 pies sobre el lago.', phone: '5540440422', icon: 'fa-parachute-box' },
                { id: 2, name: 'Lanchas', desc: 'Clases de esquí, wakeboard, paseos en dona y recorridos guiados.', phone: '7341406030', icon: 'fa-ship' }
            ],
            extra: [
                { id: 1, name: 'Cuatrimotos y RZR', desc: 'Explora los alrededores en vehículos todo terreno.', phone: '5591394024', icon: 'fa-motorcycle' },
                { id: 2, name: '510 Padel Club', desc: 'Canchas profesionales. Horario: 8AM-10PM', phone: '7772574250', link: 'https://maps.app.goo.gl/HcDoKo7KdiMgNVPfA', icon: 'fa-table-tennis-paddle-ball' },
                { id: 3, name: 'Bungee Jumping', desc: 'Salta al vacío desde una plataforma sobre el agua.', phone: '5525148067', link: 'https://maps.app.goo.gl/QwSmewmQFmtLTuJY6', icon: 'fa-person-falling' }
            ],
            delivery: [
                { id: 1, name: 'Pizza & Tortas Crazy', phone: '7343471343' },
                { id: 2, name: 'Tacos Shadavi', phone: '7341427747' },
                { id: 3, name: 'Carne Asada (Congelada)', phone: '7341180043' }
            ]
        };

        // ─── CLIMA ────────────────────────────────────────────────────────────
        const WMO = {
            0:['☀️','Despejado'],1:['🌤️','Mayormente despejado'],2:['⛅','Parcialmente nublado'],
            3:['☁️','Nublado'],45:['🌫️','Neblina'],51:['🌦️','Llovizna ligera'],
            61:['🌧️','Lluvia ligera'],63:['🌧️','Lluvia'],80:['🌦️','Chubascos'],95:['⛈️','Tormenta']
        };
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=18.6167&longitude=-99.2333&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,uv_index&wind_speed_unit=kmh&timezone=America%2FMexico_City');
                const d = (await res.json()).current;
                const [icon, desc] = WMO[d.weather_code] || ['🌡️','Variable'];
                const uv = d.uv_index <= 2 ? 'UV Bajo' : d.uv_index <= 5 ? 'UV Moderado' : d.uv_index <= 7 ? 'UV Alto' : 'UV Muy Alto';
                document.getElementById('weather-icon').textContent = icon;
                document.getElementById('weather-temp').textContent = Math.round(d.temperature_2m);
                document.getElementById('weather-desc').textContent = desc;
                document.getElementById('weather-humidity').textContent = `${d.relative_humidity_2m}% humedad`;
                document.getElementById('weather-wind').textContent = `${Math.round(d.wind_speed_10m)} km/h`;
                document.getElementById('weather-uv').textContent = uv;
                document.getElementById('weather-loading').classList.add('hidden');
                const el = document.getElementById('weather-data');
                el.classList.remove('hidden');
                el.classList.add('weather-in');
            } catch {
                document.getElementById('weather-loading').classList.add('hidden');
                document.getElementById('weather-error').classList.remove('hidden');
            }
        }

        // ─── ANALYTICS: REGISTRAR VISITA ─────────────────────────────────────
        async function trackVisit() {
            try {
                // Geo aproximado con ip-api (gratis, sin key)
                let city = 'Desconocida', country = 'MX', region = '';
                try {
                    const geo = await fetch('https://ip-api.com/json/?fields=country,regionName,city,countryCode');
                    const g = await geo.json();
                    city = g.city || 'Desconocida';
                    country = g.countryCode || 'MX';
                    region = g.regionName || '';
                } catch {}

                const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
                const hour = new Date().getHours();
                const device = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Móvil' : 'Escritorio';

                // Documento diario: acumula visitas por día
                const dayRef = doc(db, 'artifacts', currentAppId, 'analytics', 'daily', 'days', today);
                const daySnap = await getDoc(dayRef);
                if (daySnap.exists()) {
                    await updateDoc(dayRef, { visits: increment(1) });
                } else {
                    await setDoc(dayRef, { date: today, visits: 1 });
                }

                // Log individual de visita
                const visitsCol = collection(db, 'artifacts', currentAppId, 'analytics', 'visits', 'log');
                await addDoc(visitsCol, {
                    timestamp: serverTimestamp(),
                    city, country, region, device, hour,
                    userAgent: navigator.userAgent.substring(0, 100)
                });

                // Tiempo en página: guardar al salir
                const startTime = Date.now();
                window.addEventListener('beforeunload', async () => {
                    const seconds = Math.round((Date.now() - startTime) / 1000);
                    if (seconds > 5 && seconds < 3600) {
                        const timeRef = doc(db, 'artifacts', currentAppId, 'analytics', 'time', 'summary', 'current');
                        const snap = await getDoc(timeRef);
                        if (snap.exists()) {
                            await updateDoc(timeRef, { totalSeconds: increment(seconds), sessions: increment(1) });
                        } else {
                            await setDoc(timeRef, { totalSeconds: seconds, sessions: 1 });
                        }
                    }
                });
            } catch (e) { console.warn('Analytics error:', e); }
        }

        // ─── ANALYTICS: CARGAR PANEL ─────────────────────────────────────────
        window.loadAnalytics = async () => {
            const loading = document.getElementById('analytics-loading');
            const content = document.getElementById('analytics-content');
            loading.classList.remove('hidden');
            content.classList.add('hidden');

            try {
                // Últimos 7 días
                const days = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    days.push(d.toISOString().split('T')[0]);
                }
                let totalVisits = 0;
                const dailyData = [];
                for (const day of days) {
                    const snap = await getDoc(doc(db, 'artifacts', currentAppId, 'analytics', 'daily', 'days', day));
                    const v = snap.exists() ? snap.data().visits : 0;
                    totalVisits += v;
                    dailyData.push({ day: day.slice(5), visits: v }); // MM-DD
                }

                // Últimas visitas
                const visitsQ = query(
                    collection(db, 'artifacts', currentAppId, 'analytics', 'visits', 'log'),
                    orderBy('timestamp', 'desc'), limit(20)
                );
                const visitsSnap = await getDocs(visitsQ);
                const recentVisits = [];
                const cityCount = {};
                const deviceCount = { 'Móvil': 0, 'Escritorio': 0 };
                visitsSnap.forEach(d => {
                    const v = d.data();
                    recentVisits.push(v);
                    const key = `${v.city}, ${v.country}`;
                    cityCount[key] = (cityCount[key] || 0) + 1;
                    if (v.device) deviceCount[v.device] = (deviceCount[v.device] || 0) + 1;
                });

                // Tiempo promedio
                const timeSnap = await getDoc(doc(db, 'artifacts', currentAppId, 'analytics', 'time', 'summary', 'current'));
                let avgTime = '—';
                if (timeSnap.exists()) {
                    const t = timeSnap.data();
                    const avg = Math.round(t.totalSeconds / t.sessions);
                    avgTime = avg >= 60 ? `${Math.floor(avg/60)}m ${avg%60}s` : `${avg}s`;
                }

                // Top ciudades
                const topCities = Object.entries(cityCount).sort((a,b) => b[1]-a[1]).slice(0,5);

                // Max para barra
                const maxV = Math.max(...dailyData.map(d => d.visits), 1);

                // Render
                const mobileP = deviceCount['Móvil'] + deviceCount['Escritorio'] > 0
                    ? Math.round(deviceCount['Móvil'] / (deviceCount['Móvil'] + deviceCount['Escritorio']) * 100)
                    : 0;

                content.innerHTML = `
                    <!-- KPIs -->
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-cyan-600 text-white p-4 rounded-2xl text-center shadow-lg">
                            <p class="text-2xl font-black text-white">${totalVisits}</p>
                            <p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Visitas (7d)</p>
                        </div>
                        <div class="bg-emerald-600 text-white p-4 rounded-2xl text-center shadow-lg">
                            <p class="text-2xl font-black text-white">${avgTime}</p>
                            <p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Tiempo prom.</p>
                        </div>
                        <div class="bg-indigo-600 text-white p-4 rounded-2xl text-center shadow-lg">
                            <p class="text-2xl font-black text-white">${mobileP}%</p>
                            <p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Desde móvil</p>
                        </div>
                    </div>

                    <!-- GRÁFICA DE BARRAS (últimos 7 días) -->
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 italic">Visitas últimos 7 días</p>
                        <div class="flex items-end gap-1.5 h-20">
                            ${dailyData.map(d => `
                                <div class="flex-1 flex flex-col items-center gap-1">
                                    <span class="text-[8px] font-bold text-slate-500">${d.visits > 0 ? d.visits : ''}</span>
                                    <div class="w-full rounded-t-lg transition-all" style="height:${Math.max(4, Math.round((d.visits/maxV)*64))}px; background: ${d.visits > 0 ? '#0891b2' : '#e2e8f0'}"></div>
                                    <span class="text-[7px] text-slate-400 font-bold">${d.day}</span>
                                </div>`).join('')}
                        </div>
                    </div>

                    <!-- TOP CIUDADES -->
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 px-4 pt-4 pb-2 italic">Top ciudades</p>
                        ${topCities.length === 0
                            ? '<p class="text-[10px] italic text-slate-300 text-center pb-4">Sin datos aún</p>'
                            : topCities.map(([city, count]) => `
                                <div class="flex justify-between items-center px-4 py-2.5 border-t border-slate-50">
                                    <span class="text-xs font-bold text-slate-700">${city}</span>
                                    <span class="bg-cyan-100 text-cyan-700 text-[9px] font-black px-2 py-0.5 rounded-full">${count}</span>
                                </div>`).join('')}
                    </div>

                    <!-- ÚLTIMAS VISITAS -->
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 px-4 pt-4 pb-2 italic">Últimas visitas</p>
                        ${recentVisits.length === 0
                            ? '<p class="text-[10px] italic text-slate-300 text-center pb-4">Sin visitas registradas aún</p>'
                            : recentVisits.slice(0,10).map(v => {
                                const ts = v.timestamp?.toDate ? v.timestamp.toDate().toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }) : '—';
                                return `<div class="flex justify-between items-center px-4 py-2.5 border-t border-slate-50">
                                    <div>
                                        <p class="text-[10px] font-bold text-slate-700">${v.city || '?'}, ${v.country || '?'}</p>
                                        <p class="text-[9px] text-slate-400">${ts} · ${v.device || '?'}</p>
                                    </div>
                                    <span class="text-lg">${v.device === 'Móvil' ? '📱' : '💻'}</span>
                                </div>`;
                            }).join('')}
                    </div>
                `;

                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (e) {
                loading.innerHTML = `<p class="text-xs text-red-400 text-center italic">Error cargando analytics: ${e.message}</p>`;
            }
        };

        // ─── INIT ─────────────────────────────────────────────────────────────
        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);

                const docRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'siteConfig', 'current');
                onSnapshot(docRef, (snap) => {
                    if (snap.exists()) siteData = snap.data();
                    else setDoc(docRef, siteData);
                    renderApp();
                }, () => renderApp());

                // Registrar visita (sin bloquear render)
                trackVisit();
            } catch (e) {
                renderApp();
            }
        }

        // ─── RENDER APP ───────────────────────────────────────────────────────
        function renderApp() {
            document.getElementById('app-content').innerHTML = `
            <div class="flex-grow">
                <header class="bg-gradient-to-br from-cyan-600 via-teal-500 to-emerald-500 text-white p-8 rounded-b-[3.5rem] shadow-xl text-center relative z-10">
                    <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/graphy.png')] rounded-b-[3.5rem]"></div>
                    <div class="relative">
                        <p class="text-cyan-100 text-[10px] font-extrabold tracking-[0.3em] uppercase mb-2">Club Náutico Teques</p>
                        <h1 class="text-3xl font-extrabold mb-4 tracking-tight text-white">PH3 Bienvenida</h1>

                        <!-- CLIMA -->
                        <div id="weather-widget" class="bg-white/10 backdrop-blur-lg border border-white/30 rounded-2xl px-4 py-3 mb-4 flex items-center justify-between min-h-[56px]">
                            <div id="weather-loading" class="flex items-center gap-2 w-full justify-center text-white/70 text-xs font-bold uppercase tracking-widest">
                                <i class="fa-solid fa-circle-notch animate-spin text-sm"></i>
                                <span>Obteniendo clima...</span>
                            </div>
                            <div id="weather-data" class="hidden w-full">
                                <div class="flex items-center justify-between w-full">
                                    <div class="flex items-center gap-3">
                                        <span id="weather-icon" class="text-3xl leading-none"></span>
                                        <div class="text-left">
                                            <div class="flex items-end gap-1">
                                                <span id="weather-temp" class="text-2xl font-extrabold text-white leading-none"></span>
                                                <span class="text-white/60 text-xs font-bold mb-0.5">°C</span>
                                            </div>
                                            <p id="weather-desc" class="text-[10px] font-bold text-white/70 uppercase tracking-widest mt-0.5"></p>
                                        </div>
                                    </div>
                                    <div class="text-right space-y-1">

                    html += `<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm relative">

                        </div>
                    </div>`;
                });
                html += `<button onclick="addItem('${cat.k}')" class="w-full border-2 border-dashed border-slate-200 py-3 rounded-2xl text-slate-300 font-bold text-[10px] uppercase tracking-widest hover:text-cyan-500 hover:border-cyan-200 transition-colors">+ AGREGAR</button></div></div>`;
