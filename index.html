                    renderApp();
                }, (err) => {
                    console.warn("Usando local:", err);
                    renderApp();
                });

            }

                        </div>
                        <h2 class="text-2xl font-black tracking-[0.5em] text-cyan-400 uppercase italic pb-2">Tequesquitengo</h2>
                        <div class="relative leading-[0]"><svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none"><defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs><g class="parallax"><use href="#gentle-wave" x="48" y="0" fill="rgba(6, 182, 212, 0.2)" /><use href="#gentle-wave" x="48" y="3" fill="rgba(20, 184, 166, 0.15)" /></g></svg></div>
                    </footer>
                </div>`;
            renderAdminForms();
        }

        function renderAccordion(title, icon, color, content) {
            return `<div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
                <button onclick="toggleAccordion(this)" class="w-full px-6 py-5 flex justify-between items-center text-left active:bg-slate-50 transition-colors">
                    <span class="font-extrabold text-slate-700 text-sm flex items-center italic tracking-tight text-slate-700"><i class="fa-solid ${icon} mr-3 text-${color}-500 opacity-60"></i> ${title}</span>
                    <i class="fa-solid fa-chevron-down text-slate-300 transition-transform"></i>
                </button>
                <div class="accordion-content px-6">${content}</div>
            </div>`;
        }

        function renderAdminForms() {
            const editor = document.getElementById('admin-editor');
            if(!editor) return;
            editor.innerHTML = '';
            const cats = [
                { k: 'clubs', l: 'Clubes de Playa' },
                { k: 'restaurants', l: 'Restaurantes' },
                { k: 'adventure', l: 'Aventura' },
                { k: 'extra', l: 'Más Actividades' },
                { k: 'delivery', l: 'Servicios' }
            ];
            cats.forEach(cat => {
                let html = `<div class="bg-slate-50 p-4 rounded-3xl mb-4 text-slate-700 shadow-inner"><h3 class="text-xs font-black mb-4 uppercase tracking-widest text-slate-400 italic">${cat.l}</h3><div class="space-y-4">`;
                siteData[cat.k].forEach((item, i) => {
                    html += `<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm relative text-slate-700">
                        <button onclick="deleteItem('${cat.k}', ${i})" class="absolute top-2 right-2 text-red-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                        <input class="w-full border-b mb-2 p-1 text-sm font-bold outline-none text-slate-800" value="${item.name}" onchange="updateData('${cat.k}', ${i}, 'name', this.value)">
                        <textarea class="w-full border-b mb-2 p-1 text-[10px] italic outline-none text-slate-600" onchange="updateData('${cat.k}', ${i}, 'desc', this.value)">${item.desc || ''}</textarea>
                        <div class="flex gap-2"><input class="w-1/2 border-b p-1 text-[10px] outline-none text-slate-600" value="${item.phone || ''}" onchange="updateData('${cat.k}', ${i}, 'phone', this.value)" placeholder="Tel">
                        <input class="w-1/2 border-b p-1 text-[10px] outline-none text-slate-600" value="${item.link || ''}" onchange="updateData('${cat.k}', ${i}, 'link', this.value)" placeholder="URL"></div>
                    </div>`;
                });
                html += `<button onclick="addItem('${cat.k}')" class="w-full border-2 border-dashed border-slate-200 py-3 rounded-2xl text-slate-300 font-bold text-[10px] uppercase tracking-widest transition-colors hover:text-cyan-500 hover:border-cyan-200">+ AGREGAR ITEM</button></div></div>`;
                editor.innerHTML += html;
            });
        }

        window.updateData = (cat, i, field, val) => { siteData[cat][i][field] = val; };
        window.addItem = (cat) => { siteData[cat].push({ name: 'Nuevo Item', desc: '', phone: '', link: '', icon: 'fa-star' }); renderAdminForms(); };
        window.deleteItem = (cat, i) => { siteData[cat].splice(i, 1); renderAdminForms(); };
        
        window.saveChanges = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> SINCRONIZANDO...';
            btn.disabled = true;
            try {
                if (db) {
                    await setDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'siteConfig'), siteData);
                    alert("¡Guía actualizada en la nube!");
                } else alert("Error de conexión. Verifique Firebase.");
                closeAdminPanel();
            } catch (e) { alert("Error al guardar: " + e.message); }
            btn.innerHTML = 'Guardar Cambios'; btn.disabled = false; renderApp();
        };

        // --- LÓGICA DE SEGURIDAD ADMIN ---
        window.requestAdminAccess = () => {
            document.getElementById('admin-pass-input').value = "";
            document.getElementById('pass-error').classList.add('hidden');
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('admin-pass-input').focus();
        };

        window.closePasswordModal = () => {
            document.getElementById('password-modal').classList.add('hidden');
        };

        window.checkAdminPassword = () => {
            const input = document.getElementById('admin-pass-input').value;
            if (input === ADMIN_PASSWORD) {
                closePasswordModal();
                document.getElementById('admin-panel').classList.add('active');
            } else {
                document.getElementById('pass-error').classList.remove('hidden');
                document.getElementById('admin-pass-input').value = "";
            }
        };

        window.closeAdminPanel = () => {
            document.getElementById('admin-panel').classList.remove('active');
        };

        window.toggleAccordion = (btn) => {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('.fa-chevron-down');
            content.classList.toggle('open');
            if (icon) icon.classList.toggle('rotate-180');
        };
        window.copyWifi = () => {
            navigator.clipboard.writeText('123456789');
            const btn = document.getElementById('wifiBtn');
            btn.innerHTML = '<span>¡COPIADA!</span>';
            setTimeout(() => { renderApp(); }, 2000);
        };
        window.scrollToSection = (id) => document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        window.openContactOptions = (name, phone, mapUrl = null, isEmergency = false) => {
            const modal = document.getElementById('contactModal');
            document.getElementById('modal-contact-name').innerText = name;
            document.getElementById('modal-contact-phone').innerText = phone;
            document.getElementById('btn-call').href = `tel:${phone}`;
            const waBtn = document.getElementById('btn-whatsapp');
            if (isEmergency) waBtn.classList.add('hidden');
            else { waBtn.classList.remove('hidden'); waBtn.href = `https://wa.me/52${phone.replace(/\D/g, '')}`; }
            const mapBtn = document.getElementById('btn-map');
            if (mapUrl) { mapBtn.href = mapUrl; mapBtn.classList.remove('hidden'); mapBtn.classList.add('flex'); }
            else mapBtn.classList.add('hidden');
            modal.classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('contactModal').classList.add('hidden');
        window.shareDiscovery = () => {
            const template = `¡Hola! Descubrí algo increíble en Teques que quiero recomendar para futuros huéspedes:\n\n📍 Nombre:\n✨ Recomendación:`;
            window.location.assign(`https://wa.me/525554317512?text=${encodeURIComponent(template)}`);
        };

        // Escuchar "Enter" en el input de contraseña
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('password-modal').classList.contains('hidden')) {
                checkAdminPassword();
            }
        });

        init();
    </script>

    <div id="contactModal" class="fixed inset-0 z-[100] hidden">
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="flex min-h-full items-center justify-center p-6 text-center text-slate-700">
            <div class="relative transform overflow-hidden rounded-[3rem] bg-white text-left shadow-2xl transition-all w-full max-w-xs border border-cyan-50">
                <div class="bg-white px-6 pb-10 pt-12 text-center relative">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-br from-cyan-100 to-emerald-50 rounded-b-[50%] -mt-10 opacity-40"></div>
                    <div class="relative z-10 text-slate-700 text-center">
                        <h3 class="text-xl font-black mb-1 italic uppercase text-slate-800" id="modal-contact-name">Nombre</h3>
                        <p class="text-2xl font-mono text-teal-800 font-black mb-10 italic" id="modal-contact-phone">0000000000</p>
                        <div class="space-y-3">
                            <a id="btn-call" href="#" class="flex w-full justify-center items-center rounded-2xl bg-slate-900 px-4 py-4 text-[11px] font-black text-white shadow-xl uppercase tracking-widest text-white transition-transform">📞 LLAMAR</a>
                            <a id="btn-whatsapp" href="#" target="_blank" class="flex w-full justify-center items-center rounded-2xl bg-[#25D366] py-4 text-[11px] font-black text-white shadow-xl italic text-white transition-transform">WHATSAPP</a>
                            <a id="btn-map" href="#" target="_blank" class="hidden w-full justify-center items-center rounded-2xl bg-cyan-600 px-4 py-4 text-[11px] font-black text-white shadow-xl text-white uppercase transition-transform">📍 MAPA</a>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-50 px-4 py-4 text-center"><button class="text-[10px] font-black text-slate-400 tracking-widest uppercase" onclick="closeModal()">Cerrar</button></div>
            </div>
        </div>
    </div>

    <a href="https://wa.me/525554317512" target="_blank" class="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white py-4 px-6 rounded-full shadow-2xl flex items-center gap-3 hover:bg-[#20bd5a] transition-all pulse-aqua border-2 border-white/30 text-white">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span class="font-black text-xs tracking-tight uppercase">AYUDA HOST</span>
    </a>
</body>
</html>
