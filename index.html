<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH3 - Guía Digital Tequesquitengo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .accordion-content { transition: all 0.3s ease-in-out; max-height: 0; overflow: hidden; opacity: 0; }
        .accordion-content.open { max-height: 2000px; opacity: 1; padding-bottom: 1.5rem; }
        .rotate-180 { transform: rotate(180deg); }

        /* Carousel: mobile scrolls, desktop grid */
        .carousel-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 1rem; padding: 0.5rem 0.25rem 1.5rem 0.25rem; scrollbar-width: none; }
        .carousel-container::-webkit-scrollbar { display: none; }
        .carousel-item { flex: 0 0 85%; scroll-snap-align: center; }
        @media (min-width: 768px) {
            .carousel-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); overflow: visible; scroll-snap-type: none; padding: 0.5rem 0; }
            .carousel-item { flex: none; }
        }

        .waves { position: relative; width: 100%; height: 60px; display: block; margin-top: -10px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }

        .admin-panel { display: none; position: fixed; inset: 0; background: white; z-index: 100; overflow-y: auto; }
        .admin-panel.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .pulse-aqua { animation: pulse-aqua-animation 2s infinite; }
        @keyframes pulse-aqua-animation {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        @keyframes weatherFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .weather-in { animation: weatherFadeIn 0.5s ease forwards; }

        /* Hero parallax grain */
        .hero-grain::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            border-radius: inherit;
            pointer-events: none;
            z-index: 1;
        }

        /* Desktop hero layout */
        @media (min-width: 768px) {
            .hero-desktop-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
                align-items: center;
                text-align: left;
            }
            .hero-desktop-grid .hero-text { text-align: left; }
            .hero-desktop-grid .hero-widgets { display: flex; flex-direction: column; gap: 1rem; }
        }

        /* Fade in on scroll */
        .fade-section { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .fade-section.visible { opacity: 1; transform: translateY(0); }

        /* Desktop sidebar layout */
        @media (min-width: 1024px) {
            .desktop-layout { display: grid; grid-template-columns: 1fr 320px; gap: 2rem; }
        }

        /* Card hover for desktop */
        @media (min-width: 768px) {
            .card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
            .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        }

        /* Quick actions grid desktop */
        @media (min-width: 768px) {
            .quick-actions-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body class="bg-[#F0FDFD] text-slate-800 antialiased">

    <!-- SHELL: mobile centered, desktop full width with max -->
    <div id="app-content" class="max-w-5xl mx-auto bg-white min-h-screen shadow-2xl overflow-hidden relative border-x border-cyan-50 flex flex-col">
        <div class="p-20 text-center text-cyan-600 flex flex-col items-center justify-center min-h-screen">
            <i class="fa-solid fa-circle-notch animate-spin text-4xl mb-4 text-cyan-500"></i>
            <p class="font-bold uppercase tracking-widest text-xs text-cyan-700">Sincronizando PH3...</p>
        </div>
    </div>

    <!-- MODAL CONTRASEÑA -->
    <div id="password-modal" class="fixed inset-0 z-[120] hidden text-slate-700">
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closePasswordModal()"></div>
        <div class="flex min-h-full items-center justify-center p-6">
            <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-xs shadow-2xl relative text-center">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>
                <h3 class="text-lg font-black text-slate-800 mb-2 uppercase italic tracking-tighter">Acceso Restringido</h3>
                <p class="text-xs text-slate-500 mb-6">Ingresa la clave para editar la guía</p>
                <input type="password" id="admin-pass-input" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl py-4 px-6 text-center text-xl font-black tracking-[0.5em] outline-none focus:border-cyan-500 transition-all mb-4 text-slate-800" placeholder="••••">
                <button onclick="checkAdminPassword()" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">Entrar</button>
                <p id="pass-error" class="text-red-500 text-[10px] font-bold mt-3 hidden uppercase italic">Contraseña incorrecta</p>
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-panel" class="admin-panel">
        <div class="sticky top-0 bg-white z-10 px-6 py-4 flex justify-between items-center border-b border-slate-100 shadow-sm">
            <h2 class="text-xl font-black text-slate-800 italic uppercase tracking-tighter">Panel de Control</h2>
            <button onclick="closeAdminPanel()" class="bg-slate-100 p-3 rounded-full text-slate-500 active:scale-90 transition-transform"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex gap-2 px-6 py-3 border-b border-slate-100 bg-slate-50">
            <button onclick="switchTab('analytics')" id="tab-analytics" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-slate-800 text-white transition-all">📊 Analytics</button>
            <button onclick="switchTab('editor')" id="tab-editor" class="flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-white text-slate-400 border border-slate-200 transition-all">✏️ Editar</button>
        </div>
        <div id="panel-analytics" class="p-5 pb-32 space-y-4 max-w-2xl mx-auto">
            <div id="analytics-loading" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-3 block"></i>
                <p class="text-xs font-bold uppercase tracking-widest">Cargando datos...</p>
            </div>
            <div id="analytics-content" class="hidden space-y-4"></div>
        </div>
        <div id="panel-editor" class="hidden p-5 pb-32 max-w-2xl mx-auto">
            <div id="admin-editor" class="space-y-6 text-slate-700"></div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t flex gap-2 max-w-2xl mx-auto z-[110]">
            <button onclick="saveChanges()" id="saveBtn" class="flex-grow bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all uppercase tracking-widest text-xs">
                GUARDAR CAMBIOS EN LA NUBE
            </button>
        </div>
    </div>

    <!-- BOTÓN ADMIN -->
    <button onclick="requestAdminAccess()" class="fixed bottom-4 left-4 z-40 opacity-10 hover:opacity-100 bg-slate-800 text-white w-10 h-10 rounded-full flex items-center justify-center transition-all">
        <i class="fa-solid fa-gear"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp, increment, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB1u6Bz1PsjPUuczQ6ZjvYaQVCxUbWdj9Q",
            authDomain: "airbnb-e780c.firebaseapp.com",
            projectId: "airbnb-e780c",
            storageBucket: "airbnb-e780c.firebasestorage.app",
            messagingSenderId: "459942265651",
            appId: "1:459942265651:web:9ecd9c2e1c92804053f446"
        };

        const currentAppId = 'ph3-teques-live';
        const ADMIN_PASSWORD = "34650";
        let db, auth, siteData;

        siteData = {
            clubs: [
                { id: 1, name: 'Paradise', desc: 'Excelente vista, alberca, bar y acceso directo al lago.', link: 'https://share.google/YlpZUbnx8PZsF0HMq', icon: 'fa-umbrella-beach' },
                { id: 2, name: 'Vikingos', desc: 'Ambiente clásico, muy buena comida y excelente servicio.', link: 'https://share.google/PEeBakGml2VYtPnoC', icon: 'fa-ship' }
            ],
            restaurants: [
                { id: 1, name: 'Jardines de México', desc: 'Gastronomía de alto nivel en un entorno natural.', phone: '5541304269', link: 'https://maps.app.goo.gl/FK7zsa6SMWEcigDb7' },
                { id: 2, name: 'Cangrejito Playero', desc: 'Los mariscos más frescos y ambiente climatizado.', phone: '7346904525', link: 'https://maps.app.goo.gl/B9Xqj2NSA98DB2K4A' }
            ],
            adventure: [
                { id: 1, name: 'Paracaidismo', desc: 'Vive la adrenalina máxima con un salto tándem a 17,000 pies sobre el lago.', phone: '5540440422', icon: 'fa-parachute-box' },
                { id: 2, name: 'Lanchas', desc: 'Clases de esquí, wakeboard, paseos en dona y recorridos guiados.', phone: '7341406030', icon: 'fa-ship' }
            ],
            extra: [
                { id: 1, name: 'Cuatrimotos y RZR', desc: 'Explora los alrededores en vehículos todo terreno.', phone: '5591394024', icon: 'fa-motorcycle' },
                { id: 2, name: '510 Padel Club', desc: 'Canchas profesionales. Horario: 8AM-10PM', phone: '7772574250', link: 'https://maps.app.goo.gl/HcDoKo7KdiMgNVPfA', icon: 'fa-table-tennis-paddle-ball' },
                { id: 3, name: 'Bungee Jumping', desc: 'Salta al vacío desde una plataforma sobre el agua.', phone: '5525148067', link: 'https://maps.app.goo.gl/QwSmewmQFmtLTuJY6', icon: 'fa-person-falling' }
            ],
            delivery: [
                { id: 1, name: 'Pizza & Tortas Crazy', phone: '7343471343' },
                { id: 2, name: 'Tacos Shadavi', phone: '7341427747' },
                { id: 3, name: 'Carne Asada (Congelada)', phone: '7341180043' }
            ]
        };

        const WMO = {
            0:['☀️','Despejado'],1:['🌤️','Mayormente despejado'],2:['⛅','Parcialmente nublado'],
            3:['☁️','Nublado'],45:['🌫️','Neblina'],51:['🌦️','Llovizna ligera'],
            61:['🌧️','Lluvia ligera'],63:['🌧️','Lluvia'],80:['🌦️','Chubascos'],95:['⛈️','Tormenta']
        };
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=18.6167&longitude=-99.2333&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,uv_index&wind_speed_unit=kmh&timezone=America%2FMexico_City');
                const d = (await res.json()).current;
                const [icon, desc] = WMO[d.weather_code] || ['🌡️','Variable'];
                const uv = d.uv_index <= 2 ? 'UV Bajo' : d.uv_index <= 5 ? 'UV Moderado' : d.uv_index <= 7 ? 'UV Alto' : 'UV Muy Alto';
                document.getElementById('weather-icon').textContent = icon;
                document.getElementById('weather-temp').textContent = Math.round(d.temperature_2m);
                document.getElementById('weather-desc').textContent = desc;
                document.getElementById('weather-humidity').textContent = `${d.relative_humidity_2m}% humedad`;
                document.getElementById('weather-wind').textContent = `${Math.round(d.wind_speed_10m)} km/h`;
                document.getElementById('weather-uv').textContent = uv;
                document.getElementById('weather-loading').classList.add('hidden');
                const el = document.getElementById('weather-data');
                el.classList.remove('hidden');
                el.classList.add('weather-in');
            } catch {
                document.getElementById('weather-loading').classList.add('hidden');
                document.getElementById('weather-error').classList.remove('hidden');
            }
        }

        async function trackVisit() {
            try {
                let city = 'Desconocida', country = 'MX', region = '';
                try {
                    const geo = await fetch('https://ip-api.com/json/?fields=country,regionName,city,countryCode');
                    const g = await geo.json();
                    city = g.city || 'Desconocida';
                    country = g.countryCode || 'MX';
                    region = g.regionName || '';
                } catch {}
                const today = new Date().toISOString().split('T')[0];
                const hour = new Date().getHours();
                const device = /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Móvil' : 'Escritorio';
                const dayRef = doc(db, 'artifacts', currentAppId, 'analytics', 'daily', 'days', today);
                const daySnap = await getDoc(dayRef);
                if (daySnap.exists()) { await updateDoc(dayRef, { visits: increment(1) }); }
                else { await setDoc(dayRef, { date: today, visits: 1 }); }
                const visitsCol = collection(db, 'artifacts', currentAppId, 'analytics', 'visits', 'log');
                await addDoc(visitsCol, { timestamp: serverTimestamp(), city, country, region, device, hour, userAgent: navigator.userAgent.substring(0, 100) });
                const startTime = Date.now();
                window.addEventListener('beforeunload', async () => {
                    const seconds = Math.round((Date.now() - startTime) / 1000);
                    if (seconds > 5 && seconds < 3600) {
                        const timeRef = doc(db, 'artifacts', currentAppId, 'analytics', 'time', 'summary', 'current');
                        const snap = await getDoc(timeRef);
                        if (snap.exists()) { await updateDoc(timeRef, { totalSeconds: increment(seconds), sessions: increment(1) }); }
                        else { await setDoc(timeRef, { totalSeconds: seconds, sessions: 1 }); }
                    }
                });
            } catch (e) { console.warn('Analytics error:', e); }
        }

        window.loadAnalytics = async () => {
            const loading = document.getElementById('analytics-loading');
            const content = document.getElementById('analytics-content');
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            try {
                const days = [];
                for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toISOString().split('T')[0]); }
                let totalVisits = 0;
                const dailyData = [];
                for (const day of days) {
                    const snap = await getDoc(doc(db, 'artifacts', currentAppId, 'analytics', 'daily', 'days', day));
                    const v = snap.exists() ? snap.data().visits : 0;
                    totalVisits += v;
                    dailyData.push({ day: day.slice(5), visits: v });
                }
                const visitsQ = query(collection(db, 'artifacts', currentAppId, 'analytics', 'visits', 'log'), orderBy('timestamp', 'desc'), limit(20));
                const visitsSnap = await getDocs(visitsQ);
                const recentVisits = [];
                const cityCount = {};
                const deviceCount = { 'Móvil': 0, 'Escritorio': 0 };
                visitsSnap.forEach(d => {
                    const v = d.data();
                    recentVisits.push(v);
                    const key = `${v.city}, ${v.country}`;
                    cityCount[key] = (cityCount[key] || 0) + 1;
                    if (v.device) deviceCount[v.device] = (deviceCount[v.device] || 0) + 1;
                });
                const timeSnap = await getDoc(doc(db, 'artifacts', currentAppId, 'analytics', 'time', 'summary', 'current'));
                let avgTime = '—';
                if (timeSnap.exists()) { const t = timeSnap.data(); const avg = Math.round(t.totalSeconds / t.sessions); avgTime = avg >= 60 ? `${Math.floor(avg/60)}m ${avg%60}s` : `${avg}s`; }
                const topCities = Object.entries(cityCount).sort((a,b) => b[1]-a[1]).slice(0,5);
                const maxV = Math.max(...dailyData.map(d => d.visits), 1);
                const mobileP = deviceCount['Móvil'] + deviceCount['Escritorio'] > 0 ? Math.round(deviceCount['Móvil'] / (deviceCount['Móvil'] + deviceCount['Escritorio']) * 100) : 0;
                content.innerHTML = `
                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-cyan-600 text-white p-4 rounded-2xl text-center shadow-lg"><p class="text-2xl font-black text-white">${totalVisits}</p><p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Visitas (7d)</p></div>
                        <div class="bg-emerald-600 text-white p-4 rounded-2xl text-center shadow-lg"><p class="text-2xl font-black text-white">${avgTime}</p><p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Tiempo prom.</p></div>
                        <div class="bg-indigo-600 text-white p-4 rounded-2xl text-center shadow-lg"><p class="text-2xl font-black text-white">${mobileP}%</p><p class="text-[9px] font-bold uppercase tracking-widest opacity-80 text-white mt-1">Desde móvil</p></div>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 italic">Visitas últimos 7 días</p>
                        <div class="flex items-end gap-1.5 h-20">
                            ${dailyData.map(d => `<div class="flex-1 flex flex-col items-center gap-1"><span class="text-[8px] font-bold text-slate-500">${d.visits > 0 ? d.visits : ''}</span><div class="w-full rounded-t-lg transition-all" style="height:${Math.max(4, Math.round((d.visits/maxV)*64))}px; background: ${d.visits > 0 ? '#0891b2' : '#e2e8f0'}"></div><span class="text-[7px] text-slate-400 font-bold">${d.day}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 px-4 pt-4 pb-2 italic">Top ciudades</p>
                        ${topCities.length === 0 ? '<p class="text-[10px] italic text-slate-300 text-center pb-4">Sin datos aún</p>' : topCities.map(([city, count]) => `<div class="flex justify-between items-center px-4 py-2.5 border-t border-slate-50"><span class="text-xs font-bold text-slate-700">${city}</span><span class="bg-cyan-100 text-cyan-700 text-[9px] font-black px-2 py-0.5 rounded-full">${count}</span></div>`).join('')}
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 px-4 pt-4 pb-2 italic">Últimas visitas</p>
                        ${recentVisits.length === 0 ? '<p class="text-[10px] italic text-slate-300 text-center pb-4">Sin visitas registradas aún</p>' : recentVisits.slice(0,10).map(v => { const ts = v.timestamp?.toDate ? v.timestamp.toDate().toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }) : '—'; return `<div class="flex justify-between items-center px-4 py-2.5 border-t border-slate-50"><div><p class="text-[10px] font-bold text-slate-700">${v.city || '?'}, ${v.country || '?'}</p><p class="text-[9px] text-slate-400">${ts} · ${v.device || '?'}</p></div><span class="text-lg">${v.device === 'Móvil' ? '📱' : '💻'}</span></div>`; }).join('')}
                    </div>`;
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (e) { loading.innerHTML = `<p class="text-xs text-red-400 text-center italic">Error: ${e.message}</p>`; }
        };

        async function init() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await signInAnonymously(auth);
                const docRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'siteConfig', 'current');
                onSnapshot(docRef, (snap) => {
                    if (snap.exists()) siteData = snap.data();
                    else setDoc(docRef, siteData);
                    renderApp();
                }, () => renderApp());
                trackVisit();
            } catch (e) { renderApp(); }
        }

        function renderApp() {
            document.getElementById('app-content').innerHTML = `
            <div class="flex-grow">
                <!-- HERO -->
                <header class="hero-grain bg-gradient-to-br from-cyan-700 via-teal-600 to-emerald-600 text-white relative z-10 overflow-hidden">
                    <div class="absolute inset-0 opacity-[0.07] bg-[url('https://www.transparenttextures.com/patterns/graphy.png')]"></div>
                    <!-- Decorative circles -->
                    <div class="absolute -top-20 -right-20 w-64 h-64 bg-white/5 rounded-full blur-2xl"></div>
                    <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-emerald-400/10 rounded-full blur-xl"></div>

                    <div class="relative z-10 px-6 py-10 md:px-12 md:py-16 lg:px-16">
                        <div class="hero-desktop-grid">
                            <div class="hero-text mb-8 md:mb-0">
                                <p class="text-cyan-200 text-[10px] md:text-[11px] font-extrabold tracking-[0.3em] uppercase mb-3">Club Náutico Teques</p>
                                <h1 class="font-display text-4xl md:text-5xl lg:text-6xl font-extrabold mb-3 tracking-tight text-white leading-[1.1]">Bienvenido a<br>Tequesquitengo</h1>
                                <p class="text-cyan-100/70 text-sm md:text-base max-w-md leading-relaxed">Tu guía digital con todo lo que necesitas para disfrutar al máximo tu estancia en el lago.</p>
                            </div>

                            <div class="hero-widgets space-y-4">
                                <!-- CLIMA -->

                    </div>`;
                });
                html += `<button onclick="addItem('${cat.k}')" class="w-full border-2 border-dashed border-slate-200 py-3 rounded-2xl text-slate-300 font-bold text-[10px] uppercase tracking-widest hover:text-cyan-500 hover:border-cyan-200 transition-colors">+ AGREGAR</button></div></div>`;
                editor.innerHTML += html;
            });
        }

        window.switchTab = (tab) => {
            const isAnalytics = tab === 'analytics';
            document.getElementById('panel-analytics').classList.toggle('hidden', !isAnalytics);
            document.getElementById('panel-editor').classList.toggle('hidden', isAnalytics);
            document.getElementById('tab-analytics').className = `flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${isAnalytics ? 'bg-slate-800 text-white' : 'bg-white text-slate-400 border border-slate-200'}`;
            document.getElementById('tab-editor').className = `flex-1 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${!isAnalytics ? 'bg-slate-800 text-white' : 'bg-white text-slate-400 border border-slate-200'}`;
            if (isAnalytics) loadAnalytics();
        };
        window.updateData = (cat, i, field, val) => { siteData[cat][i][field] = val; };
        window.addItem = (cat) => { siteData[cat].push({name:'Nuevo Item',desc:'',phone:'',link:'',icon:'fa-star'}); renderAdminForms(); };
        window.deleteItem = (cat, i) => { if (confirm('¿Eliminar este item?')) { siteData[cat].splice(i,1); renderAdminForms(); } };
        window.saveChanges = async () => {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> SINCRONIZANDO...';
            btn.disabled = true;
            try {
                const docRef = doc(db, 'artifacts', currentAppId, 'public', 'data', 'siteConfig', 'current');
                await setDoc(docRef, siteData);
                btn.innerHTML = '✅ GUARDADO';
                setTimeout(() => { btn.innerHTML = 'GUARDAR CAMBIOS EN LA NUBE'; btn.disabled = false; closeAdminPanel(); renderApp(); }, 1500);
            } catch (e) {
                alert('Error al guardar: ' + e.message);
                btn.innerHTML = 'GUARDAR CAMBIOS EN LA NUBE';
                btn.disabled = false;
            }
        };
        window.requestAdminAccess = () => {
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('pass-error').classList.add('hidden');
            document.getElementById('password-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('admin-pass-input').focus(), 100);
        };
        window.closePasswordModal = () => document.getElementById('password-modal').classList.add('hidden');
        window.checkAdminPassword = () => {
            if (document.getElementById('admin-pass-input').value === ADMIN_PASSWORD) {
                closePasswordModal();
                document.getElementById('admin-panel').classList.add('active');
                loadAnalytics();
            } else {
                document.getElementById('pass-error').classList.remove('hidden');
                document.getElementById('admin-pass-input').value = '';
            }
        };
        window.closeAdminPanel = () => document.getElementById('admin-panel').classList.remove('active');
        window.toggleAccordion = (btn) => {
            btn.nextElementSibling.classList.toggle('open');
            btn.querySelector('.fa-chevron-down')?.classList.toggle('rotate-180');
        };
        window.copyWifi = () => {
            navigator.clipboard.writeText('123456789');
            document.getElementById('wifiBtn').innerHTML = '<span>¡Copiada! ✓</span>';
            setTimeout(renderApp, 2000);
        };
        window.scrollToSection = (id) => document.getElementById(id)?.scrollIntoView({behavior:'smooth'});
        window.openContactOptions = (name, phone, mapUrl=null, isEmergency=false) => {
            document.getElementById('modal-contact-name').innerText = name;
            document.getElementById('modal-contact-phone').innerText = phone;
            document.getElementById('btn-call').href = `tel:${phone}`;
            const wa = document.getElementById('btn-whatsapp');
            isEmergency ? wa.classList.add('hidden') : (wa.classList.remove('hidden'), wa.href = `https://wa.me/52${phone.replace(/\D/g,'')}`);
            const mp = document.getElementById('btn-map');
            mapUrl ? (mp.href = mapUrl, mp.classList.replace('hidden','flex')) : mp.classList.replace('flex','hidden');
            document.getElementById('contactModal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('contactModal').classList.add('hidden');
        document.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('password-modal').classList.contains('hidden')) checkAdminPassword(); });

        init();
    </script>

    <!-- MODAL CONTACTO -->
    <div id="contactModal" class="fixed inset-0 z-[100] hidden">
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-md" onclick="closeModal()"></div>
        <div class="flex min-h-full items-center justify-center p-6">
            <div class="relative overflow-hidden rounded-[3rem] bg-white shadow-2xl w-full max-w-xs border border-cyan-50">
                <div class="bg-white px-6 pb-10 pt-12 text-center relative">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-br from-cyan-100 to-emerald-50 rounded-b-[50%] -mt-10 opacity-40"></div>
                    <div class="relative z-10">
                        <h3 class="text-xl font-black mb-1 italic uppercase text-slate-800" id="modal-contact-name">Nombre</h3>
                        <p class="text-2xl font-mono text-teal-800 font-black mb-10 italic" id="modal-contact-phone">0000000000</p>
                        <div class="space-y-3">
                            <a id="btn-call" href="#" class="flex w-full justify-center items-center rounded-2xl bg-slate-900 py-4 text-[11px] font-black text-white shadow-xl uppercase tracking-widest hover:bg-slate-800 transition-colors">📞 LLAMAR</a>
                            <a id="btn-whatsapp" href="#" target="_blank" class="flex w-full justify-center items-center rounded-2xl bg-[#25D366] py-4 text-[11px] font-black text-white shadow-xl hover:bg-[#20bd5a] transition-colors">WHATSAPP</a>
                            <a id="btn-map" href="#" target="_blank" class="hidden w-full justify-center items-center rounded-2xl bg-cyan-600 py-4 text-[11px] font-black text-white shadow-xl uppercase hover:bg-cyan-700 transition-colors">📍 MAPA</a>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-50 px-4 py-4 text-center">
                    <button class="text-[10px] font-black text-slate-400 tracking-widest uppercase" onclick="closeModal()">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WHATSAPP HOST -->
    <a href="https://wa.me/525554317512" target="_blank" class="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white py-4 px-6 rounded-full shadow-2xl flex items-center gap-3 pulse-aqua border-2 border-white/30 hover:scale-105 transition-transform">
        <i class="fa-brands fa-whatsapp text-2xl text-white"></i>
        <span class="font-black text-xs tracking-tight uppercase text-white">AYUDA HOST</span>
    </a>
</body>
